# Generates Umbra.xcodeproj with XcodeGen: run `xcodegen` after adding or removing files.
name: Umbra
options:
  bundleIdPrefix: design.jordancampbell
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Umbra:
    type: application
    platform: macOS
    sources:
      - path: Sources/Umbra
      - path: Resources/AppIcon.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Umbra
        PRODUCT_BUNDLE_IDENTIFIER: design.jordancampbell.umbra
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Umbra Local Signing"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: UmbraControls
        embed: true
      - package: Sparkle
  UmbraControls:
    type: app-extension
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/UmbraControls
    info:
      path: Resources/UmbraControls-Info.plist
      properties:
        CFBundleDisplayName: Umbra Controls
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Resources/UmbraControls.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_NAME: UmbraControls
        PRODUCT_BUNDLE_IDENTIFIER: design.jordancampbell.umbra.controls
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Umbra Local Signing"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
