name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: swift test

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Umbra.app (unsigned)
        run: |
          xcodegen generate
          xcodebuild -project Umbra.xcodeproj -scheme Umbra -configuration Release \
            -derivedDataPath .xcbuild CODE_SIGNING_ALLOWED=NO build
      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: Umbra.app
          path: .xcbuild/Build/Products/Release/Umbra.app

  virtual-displays:
    # Experimental: hosted runners may not allow virtual screens. Failures here don't block a merge.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Virtual screen tests
        run: scripts/e2e/virtual_displays.sh
