name: Website tests

# Runs the website's end-to-end tests (site/TESTING.md) against the live site.
on:
  deployment_status:
  schedule:
    - cron: "17 14 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    # Vercel reports a deployment status for every deploy. Only test finished production deploys.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          BASE_URL: https://umbra-mac.vercel.app
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/test-results
          retention-days: 14
