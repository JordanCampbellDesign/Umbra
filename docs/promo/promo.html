<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Umbra promo loop</title>
<!--
  Umbra promo loop: 1440x1440, 16 s (120 BPM, 8 bars, 32 beats), silent.
  A desk with a MacBook and two monitors. Umbra's real menu drives what happens on each screen.
  Everything is a pure function of time inside seek(t): no CSS transitions, no timers, no state between frames.
  Springs are closed-form step responses. A channel that changes target many times is the sum of one spring
  per change, extended over the previous cycle, so the last frame flows into the first.
  Render with scripts/promo/render.mjs.
-->
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1440px; height: 1440px; overflow: hidden; }
  #gl { position: absolute; inset: 0; width: 1440px; height: 1440px; }
  #world { position: absolute; left: 0; top: 0; width: 1440px; height: 1440px; transform-origin: 0 0; }
  #screen { position: absolute; inset: 0; pointer-events: none; }
  .g { position: absolute; left: 0; top: 0; }
  .pt { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .t { font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; color: #1D1D1F; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  .sec { color: #6E6E73; }
  svg { overflow: visible; display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1440" height="1440"></canvas>
  <div id="world"></div>
  <div id="screen"></div>
</div>
<script>
"use strict";
const P = 16, BEAT = 0.5;
const b = n => (n - 1) * BEAT;                 // start time of beat n (1-based)
const ACCENT = "#0A84FF", LABEL = "#1D1D1F", SECOND = "#6E6E73", YELLOW = "#FFCC00", INDIGO = "#5E5CE6";

// ---------------------------------------------------------------- springs
function step(t, resp, damp) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI / resp;
  if (damp >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - damp * damp);
  return 1 - Math.exp(-damp * w * t) * (Math.cos(wd * t) + (damp * w / wd) * Math.sin(wd * t));
}
function springFrom(x0, v0, target, t, resp, damp) {
  if (t <= 0) return x0;
  const w = 2 * Math.PI / resp, A = x0 - target;
  if (damp >= 1) return target + (A + (v0 + w * A) * t) * Math.exp(-w * t);
  const wd = w * Math.sqrt(1 - damp * damp), B = (v0 + damp * w * A) / wd;
  return target + Math.exp(-damp * w * t) * (A * Math.cos(wd * t) + B * Math.sin(wd * t));
}
const MORPH = [0.45, 0.86], PRESS = [0.25, 0.72], SNAP = [0.3, 0.9], CAM = [0.6, 1.0];
const LEAD = [0.28, 0.86], TRAIL = [0.42, 0.86];
// Looping channel: v0, then keys [time, value, resp?, damp?]; the last value must equal v0.
function ch(v0, keys, spring = MORPH) {
  let prev = v0;
  const steps = keys.map(k => { const d = k[1] - prev; prev = k[1]; return [k[0], d, k[2] ?? spring[0], k[3] ?? spring[1]]; });
  if (Math.abs(prev - v0) > 1e-6) console.warn("channel does not loop", v0, prev);
  return t => { let v = v0; for (const [ti, d, r, z] of steps) v += d * (step(t - ti, r, z) + step(t + P - ti, r, z) - 1); return v; };
}
const vel = (f, t) => (f(t) - f(t - 1e-3)) / 1e-3;
const clamp = (x, a, c) => Math.max(a, Math.min(c, x));
const lerp = (a, c, x) => a + (c - a) * x;
const rubber = (x, d) => x <= 0 ? 0 : (1 - 1 / (x * 0.55 / d + 1)) * d;
// Content swap: exit 120 ms (blur 6px, scale 0.96, fade); enter 60 ms later on its own spring.
function swap(t, tin, tout) {
  const wraps = tin > tout;
  const inside = wraps ? (t >= tin || t < tout + 0.12) : (t >= tin && t < tout + 0.12);
  if (!inside) return null;
  let dtIn = t - tin - 0.06; if (dtIn < -P / 2) dtIn += P;
  const e = clamp(step(dtIn, ...MORPH), 0, 1);
  let dtOut = t - tout; if (wraps && t >= tin) dtOut = -1;
  const x = clamp(dtOut / 0.12, 0, 1);
  const op = e * (1 - x);
  if (op <= 0.001) return null;
  return { op, blur: 6 * Math.max(1 - e, x), scale: 0.96 + 0.04 * e - 0.04 * x };
}
function show(el, s, base = "") {
  if (!s) { el.style.display = "none"; return false; }
  el.style.display = "block";
  el.style.opacity = s.op.toFixed(4);
  el.style.filter = s.blur > 0.05 ? `blur(${s.blur.toFixed(2)}px)` : "none";
  el.style.transform = `${base} scale(${s.scale.toFixed(4)})`;
  return true;
}
const on = (el, v) => { el.style.display = v ? "block" : "none"; return v; };

// ---------------------------------------------------------------- icons (one SF Symbols-like set)
const rays = (r1, r2, w) => [...Array(8)].map((_, i) => { const a = i * Math.PI / 4, c = Math.cos(a), s = Math.sin(a);
  return `<line x1="${12 + c * r1}" y1="${12 + s * r1}" x2="${12 + c * r2}" y2="${12 + s * r2}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`; }).join("");
const ICON = {
  sunFill: `<circle cx="12" cy="12" r="5" fill="currentColor"/>${rays(8, 10.6, 2.2)}`,
  sunMin: `<circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>` + [...Array(8)].map((_, i) => { const a = i * Math.PI / 4; return `<circle cx="${12 + Math.cos(a) * 8.4}" cy="${12 + Math.sin(a) * 8.4}" r="1.3" fill="currentColor"/>`; }).join(""),
  sunMax: `<circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/>${rays(7.4, 10.4, 2)}`,
  moon: `<path d="M19.5 14.6A8 8 0 0 1 9.4 4.5a8 8 0 1 0 10.1 10.1z" fill="currentColor"/>`,
  half: `<circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.4a8.6 8.6 0 0 1 0 17.2z" fill="currentColor"/>`,
  speaker: `<path d="M4 9.2h3.6L12 5.4v13.2l-4.4-3.8H4z" fill="currentColor"/><path d="M15.2 9a4.2 4.2 0 0 1 0 6M17.8 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>`,
  cable: `<rect x="9" y="3" width="6" height="7" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 10v11M10.2 3V1.5M13.8 3V1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
  power: `<path d="M12 3.6v7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M7.3 6.6a7.3 7.3 0 1 0 9.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>`,
  powerCircle: `<circle cx="12" cy="12" r="9.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7v5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.9 8.9a4.6 4.6 0 1 0 6.2 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
  gear: `<circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/>` + [...Array(8)].map((_, i) => { const a = i * Math.PI / 4; return `<line x1="${12 + Math.cos(a) * 6.4}" y1="${12 + Math.sin(a) * 6.4}" x2="${12 + Math.cos(a) * 9.2}" y2="${12 + Math.sin(a) * 9.2}" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>`; }).join("") + `<circle cx="12" cy="12" r="6.6" fill="none" stroke="currentColor" stroke-width="1.8"/>`,
  laptop: `<rect x="4" y="5" width="16" height="11" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 18.6h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
  display: `<rect x="3" y="4" width="18" height="12.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 20.4h6M12 16.5v3.9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>`,
  person: `<rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="10" r="3" fill="currentColor"/><path d="M6.8 18a5.2 5.2 0 0 1 10.4 0" fill="currentColor"/>`,
  sliders: `<path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="2.2" fill="#fff" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="12" r="2.2" fill="#fff" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2.2" fill="#fff" stroke="currentColor" stroke-width="1.8"/>`,
  ellipsis: `<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="16" cy="12" r="1.3" fill="currentColor"/>`,
  chevDown: `<path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`,
  chevRight: `<path d="M9.5 6.5l5.5 5.5-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`,
  updown: `<path d="M8 9.5l4-4 4 4M8 14.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`,
  wifi: `<path d="M3.5 9.5a12 12 0 0 1 17 0M6.6 12.7a7.6 7.6 0 0 1 10.8 0M9.6 15.8a3.4 3.4 0 0 1 4.8 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="18.6" r="1.3" fill="currentColor"/>`,
};
const icon = (name, size, color = "currentColor", extra = "") => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="color:${color};${extra}">${ICON[name]}</svg>`;

// ---------------------------------------------------------------- DOM helpers
const world = document.getElementById("world"), screenLayer = document.getElementById("screen");
function el(parent, html = "", css = "", cls = "g") {
  const d = document.createElement("div"); d.className = cls; d.style.cssText = css; d.innerHTML = html; parent.appendChild(d); return d;
}
const box = (e, x, y, w, h) => Object.assign(e.style, { left: `${x}px`, top: `${y}px`, width: `${w}px`, height: `${h}px` });

// ---------------------------------------------------------------- desk layout (world units)
// Screens: 0 MacBook (front), 1 LG UltraFine (left, behind), 2 Samsung C27F390 (right, behind).
const SCR = [
  { x: 720, y: 960, w: 760, h: 494, r: 12, pt: 1512, name: "Built-in Display", uv: [0.0, 0.02] },
  { x: 380, y: 420, w: 620, h: 349, r: 4, pt: 2560, name: "LG UltraFine", uv: [-0.14, -0.08] },
  { x: 1060, y: 420, w: 620, h: 349, r: 4, pt: 1920, name: "C27F390", uv: [0.16, -0.05] },
];
const K = SCR[0].w / SCR[0].pt;          // world units per macOS point on the MacBook
const KO = 0.5;                          // Umbra's on-screen display, drawn a little larger than life so it reads on camera
// Hardware drawn in the GL pass, back to front. type -2: solid with contact shadow, -1: solid, 0..2: screen.
const ITEMS = [
  // Stands run down behind the MacBook, so their feet are hidden.
  { x: 380, y: 700, w: 70, h: 190, r: 6, c: "#C9CBD0", type: -1 },          // LG neck
  { x: 1060, y: 700, w: 28, h: 180, r: 8, c: "#2B2B2E", type: -1 },         // Samsung neck
  { x: 380, y: 420, w: 644, h: 373, r: 12, c: "#141416", type: -2 },         // LG bezel
  { x: 1060, y: 426, w: 640, h: 385, r: 10, c: "#18181B", type: -2 },        // Samsung bezel with chin
  { x: 380, y: 420, w: 620, h: 349, r: 4, c: "#000000", type: 1 },
  { x: 1060, y: 420, w: 620, h: 349, r: 4, c: "#000000", type: 2 },
  { x: 720, y: 1238, w: 900, h: 16, r: 8, c: "#C3C5CA", type: -2 },          // MacBook base
  { x: 720, y: 964, w: 790, h: 530, r: 22, c: "#0E0E10", type: -2 },         // MacBook bezel
  { x: 720, y: 960, w: 760, h: 494, r: 12, c: "#000000", type: 0 },
];
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

// Umbra menu (MenuView) in points on the MacBook.
const POP = { w: 380, r: 22, base: 606 };
const ICON_X = SCR[0].x + SCR[0].w / 2 - 130 * K, ICON_Y = SCR[0].y - SCR[0].h / 2 + 12 * K;
const POP_L = Math.min(ICON_X - POP.w * K / 2, SCR[0].x + SCR[0].w / 2 - 6 * K - POP.w * K);
const POP_T = SCR[0].y - SCR[0].h / 2 + 24 * K + 5 * K;
const pw = (xPt, yPt) => [POP_L + xPt * K, POP_T + yPt * K];     // popover point -> world
const CARD_Y = [114, 252, 360], CARD_H = [128, 98, 190];
const SL_X0 = 48, SL_X1 = 320, SL_W = SL_X1 - SL_X0;               // slider track inside a card row (pt)
const SEG_W = (POP.w - 24 - 4) / 5, segX = i => 12 + 2 + SEG_W * (i + 0.5);

// ---------------------------------------------------------------- timeline
// Camera framings: [zoom, cx, cy]
const F = {
  wide: [1.0, 720, 742],
  icon: [3.0, 990, 812],
  pop: [2.75, POP_L + POP.w * K / 2, POP_T + 300 * K],
  sam: [1.66, 1052, 650],
  foot: [2.9, POP_L + POP.w * K / 2 + 30, POP_T + 470 * K],
};
const camKeys = [[b(2), F.icon], [b(4), F.pop], [b(6), F.sam], [b(13), F.pop], [b(15), F.wide], [b(18), F.foot], [b(21) + 0.1, F.wide],
  [b(22) + 0.3, F.sam], [b(27), F.foot], [b(28) + 0.2, F.wide]];
const camZ = ch(F.wide[0], camKeys.map(([t, f]) => [t, f[0]]), CAM);
const camX = ch(F.wide[1], camKeys.map(([t, f]) => [t, f[1]]), CAM);
const camY = ch(F.wide[2], camKeys.map(([t, f]) => [t, f[2]]), CAM);

// Pointer (world). Start and end below the laptop so the loop closes with the same position and velocity.
const START = [1250, 1350];
const PT = (xPt, yPt) => pw(xPt, yPt);
const sBright = () => PT(0, CARD_Y[2] + 51)[1];
const knobX = v => PT(12 + SL_X0 + SL_W * v / 100, 0)[0];
const moonY = PT(0, CARD_Y[2] + 81)[1];
const pickY = PT(0, 55)[1];
const powerSam = PT(12 + 356 - 20, CARD_Y[2] + 22);
const moreBtn = PT(282, POP.base - 22);
const MENU_X = 312 - 210;                                          // the More menu is right-aligned to its button
const nightRow = PT(MENU_X + 90, POP.base - 44 - 4 - 232 + 6 + 20 + 11);
const pKeys = [
  [0.05, ICON_X + 2, ICON_Y + 2, 0.7, 0.9],
  [b(5), knobX(80) + 30, sBright() + 30, ...SNAP],
  [b(6), knobX(80), sBright(), ...SNAP],
  [b(6) + 0.35, knobX(28), sBright(), 0.45, 0.9],
  [b(7) + 0.2, knobX(-6), sBright(), 0.45, 0.9],
  [b(8) + 0.35, knobX(0), moonY, ...SNAP],
  [b(9) + 0.05, knobX(100), moonY, 0.55, 0.9],
  [b(10) + 0.2, knobX(100) + 26 * K, moonY, 0.5, 0.9],
  [b(12) + 0.05, knobX(0), sBright(), ...SNAP],
  [b(12) + 0.3, knobX(80), sBright(), 0.35, 0.9],
  [b(13), PT(segX(1), 55)[0], pickY, ...SNAP],
  [b(15), 1150, 1180],
  [b(18), moreBtn[0], moreBtn[1], ...SNAP],
  [b(20), nightRow[0], nightRow[1], ...SNAP],
  [b(21) + 0.3, 1150, 1100],
  [b(22) + 0.3, powerSam[0], powerSam[1], ...SNAP],
  [b(27) - 0.2, moreBtn[0], moreBtn[1], ...SNAP],
  [b(27) + 0.3, nightRow[0], nightRow[1], ...SNAP],
  [b(28) + 0.3, 1150, 1250],
  [b(31) - 0.2, ICON_X + 2, ICON_Y + 2, 0.45, 0.9],
  [b(31) + 0.3, START[0], START[1], 0.7, 0.9],
];
const px = ch(START[0], pKeys.map(k => [k[0], k[1], k[3] ?? MORPH[0], k[4] ?? MORPH[1]]));
const py = ch(START[1], pKeys.map(k => [k[0], k[2], k[3] ?? MORPH[0], k[4] ?? MORPH[1]]));
const CLICKS = [b(3), b(14), b(19), b(21), b(24), b(26), b(27) + 0.05, b(28), b(31)];
const HOLDS = [[b(6) + 0.1, b(8) + 0.25], [b(9), b(11) + 0.3], [b(12) + 0.2, b(13) - 0.1]];
const pressKeys = [...CLICKS.flatMap(c => [[c, 1, ...PRESS], [c + 0.14, 0, ...PRESS]]), ...HOLDS.flatMap(([a, z]) => [[a, 1, ...PRESS], [z, 0, ...PRESS]])].sort((a, c) => a[0] - c[0]);
const pointerPress = ch(0, pressKeys);

// Hero glass: the menu bar item highlight grows into the popover and back.
const heroW = ch(0, [[b(2), 30 * K, ...SNAP], [b(4), POP.w * K], [b(31), 30 * K], [b(32), 0, ...SNAP]]);
const sExtra = ch(0, [[b(8) + 0.1, 30], [b(12) + 0.45, 0], [b(24) + 0.1, -120], [b(26) + 0.05, 0]]);
const popOpen = ch(0, [[b(4), 1], [b(31), 0]]);
const heroSwell = ch(0, [[b(3), 0.12, ...PRESS], [b(3) + 0.16, 0, ...PRESS]]);

// C27F390 brightness: held while dragged, springs after release, then follows the built-in in Sync.
const B0 = 80;
const heldB = t => clamp((px(t) - knobX(0)) / (knobX(100) - knobX(0)) * 100, 0, 100);
const syncSteps = ch(0, [[b(16), -12.5, ...PRESS], [b(17), -25, ...PRESS], [b(29), -12.5, ...PRESS], [b(30), 0, ...PRESS]]);
const [H1a, H1b] = HOLDS[0], [H3a, H3b] = HOLDS[2];
function bSam(t) {
  if (t < H1a) return B0 + syncSteps(t);
  if (t < H1b) return heldB(t);
  if (t < H3a) return 0;
  if (t < H3b) return heldB(t);
  return springFrom(heldB(H3b), vel(heldB, H3b), B0, t - H3b, ...PRESS) + syncSteps(t);
}
const bOther = t => B0 + syncSteps(t);
// Below 0%: held, a small rubber band at the end (inside the card), springs back, resets as brightness rises.
const [H2a, H2b] = HOLDS[1];
const heldZ = t => clamp((px(t) - knobX(0)) / (knobX(100) - knobX(0)) * 100, 0, 100);
const heldOver = t => rubber((px(t) - knobX(100)) / K, 6);          // at most 6 pt of stretch
function subzero(t) {
  if (t < H2a) return 0;
  if (t < H3a) return t < H2b ? heldZ(t) : 100;
  return 100 * (1 - step(t - H3a - 0.1, ...MORPH));
}
function zStretch(t) {
  if (t < H2a) return 0;
  if (t < H2b) return heldOver(t);
  return springFrom(heldOver(H2b), vel(heldOver, H2b), 0, t - H2b, ...PRESS);
}
const grabS = ch(0, [[H1a, 1, ...PRESS], [H1b, 0, ...PRESS], [H3a, 1, ...PRESS], [H3b, 0, ...PRESS]]);
const grabZ = ch(0, [[H2a, 1, ...PRESS], [H2b, 0, ...PRESS]]);

// Mode picker: Manual -> Sync on beat 14; back to Manual while the menu is closed.
const pillL = ch(12 + 2, [[b(14), 12 + 2 + SEG_W, ...TRAIL], [b(31) + 0.3, 12 + 2, ...TRAIL]]);
const pillR = ch(12 + 2 + SEG_W, [[b(14), 12 + 2 + 2 * SEG_W, ...LEAD], [b(31) + 0.3, 12 + 2 + SEG_W, ...LEAD]]);
const isSync = t => t >= b(14) && t < b(31) + 0.3;

const night = ch(0, [[b(21), 1, 0.8, 1], [b(28), 0, 0.8, 1]]);
const blackOut = ch(0, [[b(24), 1, 0.25, 1], [b(26), 0, 0.3, 1]]);
const samOff = t => t >= b(24) && t < b(26);
const menuOpen = t => (t >= b(19) && t < b(21)) || (t >= b(27) + 0.1 && t < b(28));
const keyDown = ch(0, [[b(16), 1, ...PRESS], [b(16) + 0.12, 0, ...PRESS], [b(17), 1, ...PRESS], [b(17) + 0.12, 0, ...PRESS]]);
const keyUp = ch(0, [[b(29), 1, ...PRESS], [b(29) + 0.12, 0, ...PRESS], [b(30), 1, ...PRESS], [b(30) + 0.12, 0, ...PRESS]]);

// Per-screen exposure (rgb) and blackout.
function screenState(i, t) {
  const br = i === 2 ? bSam(t) : bOther(t);
  const z = i === 2 ? subzero(t) : 0;
  const n = night(t);
  const lum = (0.38 + 0.62 * br / 100) * (1 - 0.82 * z / 100);
  return { e: [lum * lerp(1, 0.9, n), lum * lerp(1, 0.74, n), lum * lerp(1, 0.52, n)], black: i === 2 ? clamp(blackOut(t), 0, 1) : 0, lum, n };
}

// ---------------------------------------------------------------- wallpaper
const WP = 2048;
function makeWallpaper() {
  const c = document.createElement("canvas"); c.width = c.height = WP;
  const g = c.getContext("2d");
  g.fillStyle = "#1B3A8C"; g.fillRect(0, 0, WP, WP);
  const blob = (x, y, r, col, a) => {
    const rg = g.createRadialGradient(x * WP, y * WP, 0, x * WP, y * WP, r * WP);
    rg.addColorStop(0, col); rg.addColorStop(1, col + "00");
    g.globalAlpha = a; g.fillStyle = rg; g.fillRect(0, 0, WP, WP); g.globalAlpha = 1;

      <span class="ic"></span><span class="t tt" style="font-size:13px;font-weight:500"></span><span style="flex:1"></span>
      <span class="t num vv" style="font-size:12px;font-weight:500;color:${SECOND}"></span></div>
    <div class="bar" style="position:absolute;left:16px;top:56px;width:228px;height:6px;border-radius:3px;background:rgba(29,29,31,0.12)"><div style="height:6px;border-radius:3px"></div></div>`;
  return { e, row: e.firstElementChild, ic: e.querySelector(".ic"), tt: e.querySelector(".tt"), vv: e.querySelector(".vv"), bar: e.querySelector(".bar"), fill: e.querySelector(".bar").firstElementChild };
}
const osds = [osd(0), null, osd(2)];

// Brightness keys under the MacBook.
const keys = el(world, "", "");
keys.innerHTML = [["sunMin", "F1"], ["sunMax", "F2"]].map(([s, f], k) => `<div style="position:absolute;left:${k * 96}px;top:0;width:84px;height:66px;border-radius:12px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">${icon(s, 26, LABEL)}<span class="t sec" style="font-size:11px">${f}</span></div>`).join("");
const keyEls = [...keys.children];

// macOS arrow pointer in screen space, so it keeps its size under camera zoom.
const pointer = el(screenLayer, `<svg width="30" height="44" viewBox="0 0 17 25"><path d="M1.5 1.5v19.2l4.6-4.4 3 7 3.2-1.4-3-6.8h6.3z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  "transform-origin:3px 3px;filter:drop-shadow(0 2px 3px rgba(0,0,0,0.3))");

// ---------------------------------------------------------------- seek(t)
const hexItems = ITEMS.map(it => hex(it.c));
const OSD_PLAN = [
  // [screen, tin, tout, kind]
  [2, b(7) - 0.1, b(13) + 0.2, "sam"], [0, b(16) - 0.05, b(18), "keysDown"], [0, b(21) + 0.05, b(22) + 0.3, "nightOn"],
  [0, b(24) + 0.1, b(25) + 0.2, "off"], [0, b(26) + 0.05, b(27) - 0.1, "onAgain"], [0, b(28) + 0.05, b(28) + 0.45, "nightOff"], [0, b(28) + 0.5, b(31), "keysUp"],
];
function seek(tIn) {
  const t = ((tIn % P) + P) % P;
  const z = camZ(t), cx = camX(t), cy = camY(t);
  const toS = (x, y) => [(x - cx) * z + 720, (y - cy) * z + 720];
  world.style.transform = `translate(720px,720px) scale(${z.toFixed(5)}) translate(${(-cx).toFixed(3)}px,${(-cy).toFixed(3)}px)`;

  // Hardware and screens.
  const I = new Float32Array(NI * 4), IC = new Float32Array(NI * 4), IT = new Float32Array(NI);
  ITEMS.forEach((it, i) => { const [sx, sy] = toS(it.x, it.y); I.set([sx, sy, it.w * z / 2, it.h * z / 2], i * 4); IC.set([...hexItems[i], it.r * z], i * 4); IT[i] = it.type; });
  gl.uniform4fv(U("uItem"), I); gl.uniform4fv(U("uItemC"), IC); gl.uniform1fv(U("uItemT"), IT);
  const st = SCR.map((_, i) => screenState(i, t));
  const UV = new Float32Array(12), E = new Float32Array(9), SR = new Float32Array(12);
  SCR.forEach((s, i) => {
    UV.set([s.uv[0] + 0.012 * Math.sin(2 * Math.PI * t / P + i), s.uv[1] + 0.008 * Math.cos(2 * Math.PI * t / P + i), 0.92, st[i].black], i * 4);
    E.set(st[i].e, i * 3);
    const [sx, sy] = toS(s.x, s.y); SR.set([sx, sy, s.w * z / 2, s.h * z / 2], i * 4);
  });
  gl.uniform4fv(U("uScrUV"), UV); gl.uniform3fv(U("uScrE"), E); gl.uniform4fv(U("uScrR"), SR);

  // Glass: the menu (hero) and the on-screen displays.
  const G = new Float32Array(NG * 4), GP = new Float32Array(NG * 4);
  let ng = 0;
  const glass = (x, y, w, h, r, tint, rim, s) => { if (ng >= NG) return; const [sx, sy] = toS(x, y); G.set([sx, sy, w * z / 2, h * z / 2], ng * 4); GP.set([r * z, tint, rim, s], ng * 4); ng++; };
  const po = clamp(popOpen(t), 0, 1);
  const extra = sExtra(t);
  const popH = (POP.base + extra) * K;
  const hw = heroW(t), sw = 1 + heroSwell(t), capH = 22 * K;
  if (hw > 0.3) {
    const hh = lerp(capH * clamp(hw / (30 * K), 0, 1), popH, po);
    glass(lerp(ICON_X, POP_L + POP.w * K / 2, po), lerp(ICON_Y, POP_T + popH / 2, po), hw * sw, hh * sw, lerp(capH / 2, POP.r * K, po), 0.14, heroSwell(t) * 3, 0);
  }
  osds.forEach(o => { if (o) o.e.style.display = "none"; });
  for (const [i, tin, tout, kind] of OSD_PLAN) {
    const s = swap(t, tin, tout); if (!s) continue;
    const o = osds[i], S = SCR[i], k = S.w / S.pt, ptH = S.h / k;
    const withBar = kind === "sam" || kind.startsWith("keys");
    const hPt = withBar ? 86 : 52, wPt = 260;
    const oy = ptH - 80 - 43 - (i === 0 ? 30 : 0);
    const scale = KO / k;
    // The glass morphs with its content; on-screen displays are drawn in the screen's points, scaled up for camera.
    glass(S.x - S.w / 2 + (S.pt / 2) * k, S.y - S.h / 2 + oy * k, wPt * KO * (0.96 + 0.04 * s.op), hPt * KO * (0.96 + 0.04 * s.op), 18 * KO, 0.14, 0, i);
    const e = o.e; e.style.display = "block";
    e.style.opacity = s.op.toFixed(3); e.style.filter = s.blur > 0.05 ? `blur(${(s.blur / scale).toFixed(2)}px)` : "none";
    e.style.transform = `translate(${S.pt / 2 - wPt * scale / 2}px, ${oy - hPt * scale / 2}px) scale(${scale})`;
    e.style.width = `${wPt}px`; e.style.height = `${hPt}px`;
    let sym = "sunFill", col = YELLOW, title = S.name, val = null;
    if (kind === "sam") {
      const zz = subzero(t);
      if (zz > 0.5) { sym = "moon"; col = INDIGO; title = "C27F390 · Sub-zero"; val = 1 - zz / 100; } else val = bSam(t) / 100;
    } else if (kind.startsWith("keys")) val = bOther(t) / 100;
    else {
      title = { nightOn: "Night Mode on", nightOff: "Night Mode off", off: "C27F390 off", onAgain: "C27F390 on" }[kind];
      sym = kind === "nightOn" ? "moon" : kind === "nightOff" ? "sunFill" : "power";
      col = kind === "nightOn" ? INDIGO : kind === "nightOff" ? YELLOW : ACCENT;
    }
    o.ic.innerHTML = icon(sym, 18, col);
    o.tt.textContent = title;
    o.vv.textContent = val == null ? "" : `${Math.round(val * 100)}%`;
    on(o.bar, val != null);
    if (val != null) { o.fill.style.width = `${(228 * clamp(val, 0.03, 1)).toFixed(1)}px`; o.fill.style.background = col; }
    o.row.style.top = withBar ? "16px" : "16px";
  }
  gl.uniform4fv(U("uG"), G); gl.uniform4fv(U("uGP"), GP); gl.uniform1i(U("uNG"), ng);
  gl.uniform1f(U("uZ"), z); gl.uniform1f(U("uK"), 16 * z * K);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  // DOM screen contents follow the same exposure as the GL screens.
  SCR.forEach((s, i) => {
    const { lum, n, black } = st[i];
    scrBox[i].inner.style.filter = `brightness(${lum.toFixed(3)}) sepia(${(0.38 * n).toFixed(3)}) saturate(${(1 - 0.1 * n).toFixed(3)})`;
    scrBox[i].black.style.opacity = black.toFixed(3);
  });
  lvlFill.setAttribute("y", (6 + 12 * (1 - bOther(t) / 100)).toFixed(3));

  // ---- Umbra menu content
  if (show(pop, swap(t, b(4), b(31)))) {
    const L = pillL(t), R = pillR(t);
    Object.assign(pill.style, { left: `${Math.min(L, R) - 12}px`, width: `${Math.abs(R - L)}px` });
    const sel = isSync(t) ? 1 : 0;
    segEls.forEach((e, i) => { const d = e.firstElementChild; d.style.color = i === sel ? LABEL : SECOND; d.style.fontWeight = i === sel ? 600 : 400; });
    status.forEach(s => show(s.e, swap(t, s.a, s.z)));
    const off = clamp(-Math.min(extra, 0) / 120, 0, 1);
    const moonH = clamp(Math.max(extra, 0) / 30, 0, 1);
    cards[2].c.style.height = `${CARD_H[2] + extra}px`;
    const ad = isSync(t) ? clamp(step(t - b(14) - 0.06, ...MORPH), 0, 1) : 0;
    cards.forEach((c, i) => {
      on(c.adaptive, ad > 0.01); c.adaptive.style.opacity = ad.toFixed(3);
      c.disc.style.top = `${CARD_H[i] + (i === 2 ? extra : 0) - 28}px`;
    });
    cards[2].power.innerHTML = icon("powerCircle", 18, samOff(t) ? "#FF453A" : SECOND);
    drawSlider(sl[0], bOther(t)); drawSlider(sl[1], bOther(t));
    drawSlider(sl[2], bSam(t), grabS(t));
    if (on(moon.r, moonH > 0.02 && off < 0.01)) {
      moon.r.style.opacity = moonH.toFixed(3); moon.r.style.filter = moonH < 1 ? `blur(${(4 * (1 - moonH)).toFixed(2)}px)` : "none";
      drawSlider(moon, subzero(t), grabZ(t), zStretch(t));
    }
    contrast.r.style.top = `${70 + 30 * moonH}px`; volume.r.style.top = `${100 + 30 * moonH}px`; input.style.top = `${130 + 30 * moonH}px`;
    drawSlider(contrast, 50); drawSlider(volume, 50);
    [sl[2].r, contrast.r, volume.r, input, cards[2].disc].forEach(e => { e.style.opacity = (1 - off).toFixed(3); e.style.display = off > 0.99 ? "none" : "block"; });
    offMsg.style.opacity = off.toFixed(3); offMsg.style.display = off > 0.01 ? "block" : "none";
    const H = POP.base + extra;
    divider2.style.top = `${H - 44}px`;
    footer.style.top = `${H - 33}px`;
    moreBtnEl.style.background = menuOpen(t) ? "rgba(29,29,31,0.1)" : "transparent";
    const menuS = menuOpen(t) ? swap(t, t < b(21) ? b(19) : b(27) + 0.1, t < b(21) ? b(21) : b(28)) : null;
    if (show(menu, menuS)) {
      menu.style.top = `${H - 44 - 4 - 232}px`;
      menu.style.transformOrigin = "85% 100%";
      const hov = (t >= b(20) && t < b(21)) || (t >= b(27) + 0.35);
      nightRowEl.style.background = hov ? ACCENT : "transparent";
      nightRowEl.style.color = hov ? "#fff" : LABEL;
      nightLabel.textContent = t < b(22) ? "Night Mode" : "Turn Night Mode off";
    }
  }

  // Brightness keys under the MacBook (Sync mode: all three screens follow).
  const kS = t < b(24) ? swap(t, b(15), b(18)) : swap(t, b(28) + 0.3, b(31));
  if (show(keys, kS)) {
    box(keys, 720 - 90, 1282, 180, 66);
    keyEls[0].style.transform = `translateY(${(keyDown(t) * 5).toFixed(2)}px)`;
    keyEls[1].style.transform = `translateY(${(keyUp(t) * 5).toFixed(2)}px)`;
    keyEls[0].style.boxShadow = `0 ${lerp(10, 4, keyDown(t)).toFixed(2)}px ${lerp(30, 12, keyDown(t)).toFixed(2)}px rgba(0,0,0,0.12)`;
    keyEls[1].style.boxShadow = `0 ${lerp(10, 4, keyUp(t)).toFixed(2)}px ${lerp(30, 12, keyUp(t)).toFixed(2)}px rgba(0,0,0,0.12)`;
  }

  // Pointer
  const [sx, sy] = toS(px(t), py(t));
  const pp = clamp(pointerPress(t), 0, 1.05);
  pointer.style.transform = `translate(${(sx - 3).toFixed(2)}px, ${(sy - 3).toFixed(2)}px) scale(${(1 - 0.1 * pp).toFixed(4)})`;
}
window.seek = seek;
window.promoReady = document.fonts.ready.then(() => { seek(0); return true; });
seek(0);
</script>
</body>
</html>
